name: CI

on:
  push:
    branches: [ "main", "QRCD", "develop" ]
    paths-ignore:
      - README.md
      - docs/**
      - '*.log'
  pull_request:
    branches: [ "main", "QRCD", "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Compile
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Maven Clean
        run: mvn -B clean

      - name: Maven Compile
        run: mvn -B compile

      - name: Maven Package
        run: mvn -B package -DskipTests

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: target/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    if: success()
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: mvn -B test -DforkCount=1 -DreuseForks=false
        continue-on-error: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: Test Results

  package:
    name: Package for Deployment
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build Final Package
        run: mvn -B clean package

      - name: Create Deployment Package
        run: |
          mkdir -p deployment/libs
          cp target/*.jar deployment/libs/ 2>/dev/null || true
          cp pom.xml deployment/
          cd deployment && zip -r ../CDQR-${{ github.run_id }}.zip . && cd ..

      - name: Upload Deployment Package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: CDQR-*.zip
