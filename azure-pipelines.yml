trigger:
  branches:
    include:
    - main
    - QRCD
    - develop
  paths:
    exclude:
    - README.md
    - docs/
    - '*.log'

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  mavenPomFile: '**/pom.xml'

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Build and Compile'
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '11'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@3
      displayName: 'Maven Clean'
      inputs:
        mavenPomFile: '$(mavenPomFile)'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.11'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: false
        goals: 'clean'

    - task: Maven@3
      displayName: 'Maven Compile'
      inputs:
        mavenPomFile: '$(mavenPomFile)'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.11'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: false
        goals: 'compile'

    - task: Maven@3
      displayName: 'Maven Package'
      inputs:
        mavenPomFile: '$(mavenPomFile)'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.11'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: false
        goals: 'package -DskipTests'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'maven-build'
        publishLocation: 'Container'
      condition: always()

- stage: Test
  displayName: 'Test Stage'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: TestJob
    displayName: 'Run Selenium Tests'
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '11'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@3
      displayName: 'Run QRCD Tests'
      inputs:
        mavenPomFile: '$(mavenPomFile)'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.11'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        goals: 'test -Dtest=QRCD -DforkCount=1 -DreuseForks=false'
      continueOnError: true

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        searchFolder: '$(System.DefaultWorkingDirectory)'
        mergeTestResults: false
        testRunTitle: 'QRCD Selenium Tests'
        failTaskOnFailedTests: false
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Test Reports'
      inputs:
        pathToPublish: '$(System.DefaultWorkingDirectory)/target/surefire-reports'
        artifactName: 'test-reports'
        publishLocation: 'Container'
      condition: always()

- stage: CodeQuality
  displayName: 'Code Quality Stage'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: SonarAnalysisJob
    displayName: 'SonarQube Analysis'
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '11'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@3
      displayName: 'SonarQube Analysis'
      inputs:
        mavenPomFile: '$(mavenPomFile)'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.11'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: false
        goals: 'verify sonar:sonar -Dsonar.projectKey=CDQR-Selenium -Dsonar.projectName="CDQR Selenium Tests"'
      continueOnError: true
      condition: eq(variables['runSonarQube'], 'true')

- stage: Package
  displayName: 'Package Stage'
  dependsOn: CodeQuality
  condition: succeeded()
  jobs:
  - job: PackageJob
    displayName: 'Create Deployment Package'
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '11'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@3
      displayName: 'Final Maven Build'
      inputs:
        mavenPomFile: '$(mavenPomFile)'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.11'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: false
        goals: 'clean package'

    - task: CopyFiles@2
      displayName: 'Copy Build Artifacts'
      inputs:
        sourceFolder: '$(System.DefaultWorkingDirectory)/target'
        contents: '**/*.jar'
        targetFolder: '$(Build.ArtifactStagingDirectory)/libs'

    - task: CopyFiles@2
      displayName: 'Copy POM and Source'
      inputs:
        sourceFolder: '$(System.DefaultWorkingDirectory)'
        contents: 'pom.xml'
        targetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: ArchiveFiles@2
      displayName: 'Create Deployment Package'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/CDQR-$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Final Artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'
        publishLocation: 'Container'
