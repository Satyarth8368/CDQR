# Continuous Integration pipeline for CDQR
# Runs automatically for pushes and pull requests on the supported branches.

trigger:
  branches:
    include:
      - main
      - QRCD
      - develop
  paths:
    exclude:
      - README.md
      - docs/**
      - '*.log'

pr:
  branches:
    include:
      - main
      - QRCD
      - develop

# Set this variable to true only after the Selenium tests are made CI-safe
# (headless browser, no hard-coded local driver path, and test credentials).
variables:
  mavenPomFile: 'pom.xml'
  runSeleniumTests: 'false'
  MAVEN_CACHE_FOLDER: '$(Pipeline.Workspace)/.m2/repository'

pool:
  vmImage: 'windows-latest'

stages:
  - stage: Build
    displayName: 'Build and Package'
    jobs:
      - job: MavenBuild
        displayName: 'Maven Clean, Compile and Package'
        steps:
          - checkout: self
            clean: true

          - task: JavaToolInstaller@0
            displayName: 'Use Java 11'
            inputs:
              versionSpec: '11'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Cache@2
            displayName: 'Cache Maven dependencies'
            inputs:
              key: 'maven | "$(Agent.OS)" | $(mavenPomFile)'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(MAVEN_CACHE_FOLDER)'

          - task: Maven@3
            displayName: 'Maven clean package'
            inputs:
              mavenPomFile: '$(mavenPomFile)'
              mavenOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.11'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: false
              goals: 'clean package -DskipTests'
              options: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

          - task: CopyFiles@2
            displayName: 'Stage build files'
            inputs:
              sourceFolder: '$(Build.SourcesDirectory)'
              contents: |
                target/*.jar
                pom.xml
              targetFolder: '$(Build.ArtifactStagingDirectory)'
              flattenFolders: false

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Maven build artifact'
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'maven-build'
              publishLocation: 'Container'

  # Disabled by default because the current Selenium code contains local
  # EdgeDriver paths and live OTP/mobile-number data. Enable only after those
  # values are moved to secure pipeline variables and the browser is headless.
  - stage: SeleniumTests
    displayName: 'Selenium Tests (Optional)'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['runSeleniumTests'], 'true'))
    jobs:
      - job: SeleniumTestJob
        displayName: 'Run Selenium tests'
        timeoutInMinutes: 30
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: 'Use Java 11'
            inputs:
              versionSpec: '11'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Maven@3
            displayName: 'Run Maven tests'
            inputs:
              mavenPomFile: '$(mavenPomFile)'
              mavenOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.11'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              goals: 'test'
              options: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish test reports'
            condition: always()
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)/target/surefire-reports'
              artifactName: 'test-reports'
              publishLocation: 'Container'
              "